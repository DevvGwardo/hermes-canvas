name: CI

on:
  push:
    # This repo's branch is `master`; keep `main` too for upstream/renamed remotes.
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Test files stub globals and start timers/loops; isolate gives each file
      # a fresh context so file order cannot change the result.
      - run: bun run test
